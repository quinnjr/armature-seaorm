[package]
name = "armature-seaorm"
version = "0.3.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-seaorm"
homepage = "https://quinnjr.github.io/armature"
description = "SeaORM database integration for the Armature framework"
keywords = ["seaorm", "database", "orm", "async", "sql"]
categories = ["database", "web-programming", "asynchronous"]

[features]
default = ["runtime-tokio-rustls", "sqlx-postgres"]
# Runtime
runtime-tokio-native-tls = ["sea-orm/runtime-tokio-native-tls"]
runtime-tokio-rustls = ["sea-orm/runtime-tokio-rustls"]
# SeaORM 2.0 dropped its actix runtimes (actix runs on tokio); these names are
# kept so downstream feature lists keep resolving, and select the tokio runtime.
runtime-actix-native-tls = ["runtime-tokio-native-tls"]
runtime-actix-rustls = ["runtime-tokio-rustls"]
# Database backends
sqlx-postgres = ["sea-orm/sqlx-postgres"]
sqlx-mysql = ["sea-orm/sqlx-mysql"]
sqlx-sqlite = ["sea-orm/sqlx-sqlite"]
# Extras
with-json = ["sea-orm/with-json"]
with-chrono = ["sea-orm/with-chrono"]
with-rust_decimal = ["sea-orm/with-rust_decimal"]
with-bigdecimal = ["sea-orm/with-bigdecimal"]
with-uuid = ["sea-orm/with-uuid"]
with-time = ["sea-orm/with-time"]
mock = ["sea-orm/mock"]
debug-print = ["sea-orm/debug-print"]
tracing = ["dep:tracing"]

[dependencies]
# SeaORM
sea-orm = { version = "2.0", default-features = false, features = ["macros"] }
sea-query = "1.0"

# Async
tokio = { version = "1", features = ["sync"] }
async-trait = "0.1"

# Error handling
thiserror = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
armature-log = { version = "0.2" }
tracing = { version = "0.1", optional = true }
log = "0.4"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
armature-testkit = { path = "../armature-testkit", features = ["containers"] }

